<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#52606d"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#d64545"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3b6fd8"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <line x1="600" y1="40" x2="600" y2="520" stroke="#e4e7eb" stroke-width="1.5"/>

  <!-- 왼쪽: 이전 -->
  <text x="40" y="60" font-size="20" font-weight="700" fill="#1f2933">9월 16일 이전</text>
  <text x="40" y="88" font-size="15" fill="#52606d">서버에 체험 상태가 하나</text>

  <rect x="60" y="140" width="150" height="64" rx="10" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <text x="135" y="178" font-size="16" font-weight="600" fill="#1f2933" text-anchor="middle">태블릿 A</text>
  <rect x="60" y="330" width="150" height="64" rx="10" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <text x="135" y="368" font-size="16" font-weight="600" fill="#1f2933" text-anchor="middle">태블릿 B</text>

  <rect x="320" y="150" width="230" height="230" rx="14" fill="#e8f0ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="435" y="186" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Next.js 서버</text>
  <rect x="350" y="220" width="170" height="80" rx="10" fill="#ffffff" stroke="#d64545" stroke-width="2"/>
  <text x="435" y="254" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">체험 상태</text>
  <text x="435" y="278" font-size="13" fill="#7b8794" text-anchor="middle">한 칸</text>

  <line x1="212" y1="172" x2="346" y2="245" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="212" y1="362" x2="346" y2="280" stroke="#d64545" stroke-width="2" marker-end="url(#ar)"/>
  <text x="435" y="420" font-size="15" font-weight="600" fill="#d64545" text-anchor="middle">B의 체험이 A의 상태를 덮어씀</text>

  <!-- 오른쪽: 이후 -->
  <text x="640" y="60" font-size="20" font-weight="700" fill="#1f2933">9월 16일 이후</text>
  <text x="640" y="88" font-size="15" fill="#52606d">세션(관람객)마다 슬롯을 따로</text>

  <rect x="640" y="140" width="150" height="64" rx="10" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <text x="715" y="178" font-size="16" font-weight="600" fill="#1f2933" text-anchor="middle">태블릿 A</text>
  <rect x="640" y="330" width="150" height="64" rx="10" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <text x="715" y="368" font-size="16" font-weight="600" fill="#1f2933" text-anchor="middle">태블릿 B</text>

  <rect x="880" y="120" width="280" height="300" rx="14" fill="#e8f0ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="1020" y="156" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Next.js 서버</text>
  <rect x="910" y="176" width="220" height="70" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="1020" y="217" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">세션 A 슬롯</text>
  <rect x="910" y="326" width="220" height="70" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="1020" y="367" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">세션 B 슬롯</text>

  <line x1="792" y1="172" x2="906" y2="208" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="792" y1="362" x2="906" y2="362" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>

  <rect x="640" y="440" width="230" height="56" rx="10" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <text x="755" y="474" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">스탠바이미 · TV</text>
  <path d="M872 468 L1182 468 L1182 211 L1136 211" fill="none" stroke="#3b6fd8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="1020" y="494" font-size="13" fill="#3b6fd8" text-anchor="middle">짝 태블릿을 지정해 그 슬롯을 따라감</text>
  <text x="640" y="540" font-size="13" fill="#7b8794">오래 끊긴 슬롯은 정리 (화면이 연결돼 있으면 더 오래 유지)</text>
</svg>
