<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#52606d"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#d64545"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3b6fd8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <line x1="600" y1="40" x2="600" y2="560" stroke="#e4e7eb" stroke-width="1.5"/>

  <!-- 왼쪽: 엄격 -->
  <text x="40" y="60" font-size="20" font-weight="700" fill="#1f2933">문서 그대로 엄격하게</text>
  <text x="40" y="88" font-size="15" fill="#52606d">모든 필드를 필수로 검증</text>

  <rect x="60" y="120" width="220" height="190" rx="12" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <text x="80" y="150" font-size="15" font-weight="700" fill="#1f2933">들어온 메시지</text>
  <rect x="80" y="166" width="180" height="36" rx="8" fill="#f5f7fa"/>
  <text x="96" y="190" font-size="14" fill="#1f2933">카드 1 · 제목 · 설명</text>
  <rect x="80" y="210" width="180" height="36" rx="8" fill="#f5f7fa"/>
  <text x="96" y="234" font-size="14" fill="#1f2933">카드 2 · 제목 · 설명</text>
  <rect x="80" y="254" width="180" height="36" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/>
  <text x="96" y="278" font-size="14" fill="#1f2933">카드 3 · 제목 · <tspan fill="#d64545" font-weight="700">설명 없음</tspan></text>

  <line x1="282" y1="215" x2="346" y2="215" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>

  <rect x="350" y="170" width="200" height="90" rx="12" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
  <text x="450" y="208" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">zod 검증 실패</text>
  <text x="450" y="234" font-size="14" fill="#d64545" text-anchor="middle">메시지 전체를 버림</text>

  <line x1="450" y1="262" x2="450" y2="346" stroke="#d64545" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="320" y="350" width="260" height="170" rx="14" fill="#ffffff" stroke="#d64545" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="450" y="430" font-size="16" font-weight="700" fill="#d64545" text-anchor="middle">빈 화면</text>
  <text x="450" y="456" font-size="14" fill="#7b8794" text-anchor="middle">아무 표시 없이 멈춤</text>

  <!-- 오른쪽: 개방 -->
  <text x="640" y="60" font-size="20" font-weight="700" fill="#1f2933">드롭보다 개방</text>
  <text x="640" y="88" font-size="15" fill="#52606d">이어 붙이는 키만 필수, 나머지는 기본값</text>

  <rect x="660" y="120" width="220" height="190" rx="12" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <text x="680" y="150" font-size="15" font-weight="700" fill="#1f2933">들어온 메시지</text>
  <rect x="680" y="166" width="180" height="36" rx="8" fill="#f5f7fa"/>
  <text x="696" y="190" font-size="14" fill="#1f2933">카드 1 · 제목 · 설명</text>
  <rect x="680" y="210" width="180" height="36" rx="8" fill="#f5f7fa"/>
  <text x="696" y="234" font-size="14" fill="#1f2933">카드 2 · 제목 · 설명</text>
  <rect x="680" y="254" width="180" height="36" rx="8" fill="#fff8e6" stroke="#e0a400" stroke-width="1.5"/>
  <text x="696" y="278" font-size="14" fill="#1f2933">카드 3 · 제목 · <tspan fill="#b07d00" font-weight="700">설명 없음</tspan></text>

  <line x1="882" y1="215" x2="946" y2="215" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>

  <rect x="950" y="170" width="200" height="90" rx="12" fill="#e8f0ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="1050" y="208" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">zod 검증 통과</text>
  <text x="1050" y="234" font-size="14" fill="#3b6fd8" text-anchor="middle">빠진 설명은 기본값으로</text>

  <line x1="1050" y1="262" x2="1050" y2="346" stroke="#3b6fd8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="920" y="350" width="260" height="170" rx="14" fill="#ffffff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="940" y="378" font-size="14" font-weight="700" fill="#1f2933">화면</text>
  <rect x="940" y="390" width="220" height="34" rx="8" fill="#f5f7fa"/>
  <text x="956" y="412" font-size="13" fill="#1f2933">카드 1</text>
  <rect x="940" y="430" width="220" height="34" rx="8" fill="#f5f7fa"/>
  <text x="956" y="452" font-size="13" fill="#1f2933">카드 2</text>
  <rect x="940" y="470" width="220" height="34" rx="8" fill="#fff8e6"/>
  <text x="956" y="492" font-size="13" fill="#1f2933">카드 3 <tspan fill="#b07d00">· 설명은 기본값</tspan></text>

  <text x="40" y="572" font-size="13" fill="#7b8794">카드 내용은 설명을 위한 예시</text>
</svg>
